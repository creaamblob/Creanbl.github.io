<!DOCTYPE html>
<html id="bg" style="background-color: black;
    background: url('../Assets/BG.png') repeat center center fixed;
    -webkit-background-size: cover;
    -moz-background-size: cover;
    -o-background-size: cover;
    background-size: cover;">
    <div class="SmallScreenWarn">
        <div class="SmallScreenContain">
            Your screen is too small!<br>
            Please stretch the window or enable desktop mode in your browser!<br>
            (Usually found in a triple-dot dropdown)
        </div>
    </div>
    <head>
        <title>Crean's Website</title>
        <link rel="icon" href="../Assets/Creanbl.gif"/>
        <link rel="stylesheet" href="style.css" rel="stylesheet"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    </head><img src="../Assets/CRT.gif" class="CRT">
    

    <iframe src="Home.html" style="width: 100vw; height: 100vw; border: 0px; vertical-align: middle;"></iframe>

    <div style="position: fixed; left: 50%; transform: translate(-50%, -50%);
    bottom: -12px; line-height: 0; background-image: linear-gradient(#0000009d, black);
    border-radius: 12.5px 12.5px 0px 0px; width: 90%;">
        <button onclick="ChangeTheme()" id="themeButton">Theme : Mountain Range</button>
    </div>

    <script>
        var theme = 0;

            function ChangeTheme() {
                theme += 1;

                switch (theme) {
                    case 1: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG09.png')";
                        document.getElementById("themeButton").innerHTML = "Theme : Clouds";
                        break;
                    }
                    case 2: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG06.png')";
                        document.getElementById("themeButton").innerHTML = "Theme : Autumn";
                        break;
                    }
                    case 3: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG05.png')";
                        document.getElementById("themeButton").innerHTML = "Theme : Celestial";
                        break;
                    }
                    case 4: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG08.png')";
                        document.getElementById("themeButton").innerHTML = "Theme : Seraphic (Terraria Mods)";
                        break;
                    }
                    case 5: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/Creations/CosmicFields.png')";
                        document.getElementById("themeButton").innerHTML = "Theme : Cosmic Fields (Terraria Mods)";
                        break;
                    }
                    case 6: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG10.gif')";
                        document.getElementById("themeButton").innerHTML = "Theme : The Third Sanctuary (Deltarune)";
                        break;
                    }
                    case 7: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG11.gif')";
                        document.getElementById("themeButton").innerHTML = "Theme : WELCOME TO THE CITY (Deltarune)";
                        break;
                    }
                    case 8: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG.png')";
                        document.getElementById("themeButton").innerHTML = "Theme : Mountain Range";
                        theme = 0;
                    }
                }
            }
    </script>
    </body>
</html>
