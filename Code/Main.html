<!DOCTYPE html>
<html id="bg" style="background-color: black;
    background: url('../Assets/BG.png') repeat center center fixed;
    -webkit-background-size: cover;
    -moz-background-size: cover;
    -o-background-size: cover;
    background-size: cover;">

    <div class="SmallScreenWarn">
        <div class="SmallScreenContain">
            Your screen is too small!<br>
            Please stretch the window or enable desktop mode in your mobile browser!<br>
            (Usually found in a triple-dot dropdown)
        </div>
    </div>
    <head>
        <title>Crean's Website</title>
        <link rel="icon" href="../Assets/Creanbl.gif"/>
        <link rel="stylesheet" href="style.css" rel="stylesheet"/>
        <link rel="stylesheet" href="https://thegreenroom.neocities.org/webrings/tvtimewebring/onionring.css"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    </head>

    <style>
        .container {
            width: 100vw;
            height: 100vh;

            overflow-x: auto;
            overflow-y: auto;

            resize: none;
            position: relative;
        }
        .BottomWindow {
            position: fixed;
            left: 50%;
            transform: translate(-50%, -50%);
            bottom: -1175px;
            line-height: 0;
            background-image: linear-gradient(rgba(247, 178, 199, 0.75), rgb(66, 66, 66));
            border-radius: 12.5px 12.5px 0px 0px;
            width: 90%;
            height: 800px;
            transition: 0.5s;
            box-shadow: 0px 0px 4px white;
            border: 2px white solid;
            backdrop-filter: blur(12px);
        }
        .BottomWindow:hover {
            bottom: -725px;
        }
        .ThemeButton {
            padding: 20px;
            margin: 2px;
            background-size: cover;
            text-shadow: -1px -1px black, 1px -1px black, 1px 1px black, -1px 1px 4px black;
        }
        .Playlist {
            border: none;
            width: 250px;
            height: 250px;

            box-shadow: 0px 0px 10px white;
            border: 2px white solid;
        }
        .BotWinTab {
            line-height: normal;
            width: 100%;
            display: flexbox;
            flex-wrap: wrap;
            justify-content: center;
        }
        @keyframes CDSpin {
            0% { rotate: 0deg;}
            100% { transform: rotate(360deg);}
        }
    </style>

    <body>

    <div class="container">
        <iframe src="Home.html" style="width: 100%; height: 100%; border: 0px;"></iframe>
    </div>

    <div class="BottomWindow">
        <div class="Top" style="justify-content: left;">
            <button style="margin-left: 15px; padding: 5px;" onclick="ChangeTab(0)">Webrings</button>
            <button style="margin-left: 5px; padding: 5px;" onclick="ChangeTab(1)">Themes</button>
            <button style="margin-left: 5px; padding: 5px;" onclick="ChangeTab(2)">Playlists</button>
            <button style="background: none; border: none; box-shadow: none; margin-left: 5px;">
                ★ HOVER TO SHOW ★
            </button>
        </div>
        
        <div id="Webrings" class="BotWinTab">
            <div style="padding: 10px; border-radius: 8px; background-color: rgba(0, 0, 0, 0.5); width: 50vw; height: 400px; display: flexbox; flex-wrap: wrap; flex-direction: column; margin: auto; overflow: scroll;">
                <thought style="font-size: 20px;">(Scrollable)</thought>
                <br>
                <div id="aero-ring">
                    <script src="https://frutigeraeroarchive.org/javascript/aero-webring.js"></script>
                </div><br>
                
                <map name="win7widget-compact">
                    <area href="https://baccyflap.com/noai" target="_parent" shape="rect" coords="0,0,216,29" alt="no ai webring" title="no ai webring">
                    <area href="https://baccyflap.com/noai/?prv&s=cbl" target="_parent" shape="rect" coords="102,45,199,71" alt="previous" title="previous">
                    <area href="https://baccyflap.com/noai/?rnd" target="_parent" shape="rect" coords="102,81,199,105" alt="random" title="random">
                    <area href="https://baccyflap.com/noai/?nxt&s=cbl" target="_parent" shape="rect" coords="102,116,199,141" alt="next" title="next">
                </map>
                <img usemap="#win7widget-compact" src="https://baccyflap.com/noai/win7widget-compact.gif" alt="a Windows 7 style dialog box titled 'The No AI Webring' with a little icon showing a computer chip in a rubbish bin. beside it are three clickable buttons, labeled Previous, Random and Next"><br>
                <br>

                <div id="umwr"> 
                    <link rel="stylesheet" href="https://4ster.nekoweb.org/webrings/onionring.css"> 
                    <script src="https://4ster.nekoweb.org/webrings/onionring-variables.js"></script>
                    <script src="https://4ster.nekoweb.org/webrings/onionring-widget.js"></script>
                </div><br>

                <div class="EuBox">
                    <div id='euroring'>
                        <script type="text/javascript" src="https://euroring.neocities.org/scripts/onionring-variables.js"></script>
                        <script type="text/javascript" src="https://euroring.neocities.org/scripts/minimal.js"></script>
                    </div>
                </div><br>
                <div id="tvtimering">
                    <script type="text/javascript"
                    src="https://thegreenroom.neocities.org/webrings/tvtimewebring/onionring-variables.js"></script>
                    <script type="text/javascript" src="https://thegreenroom.neocities.org/webrings/tvtimewebring/onionring-widget.js"></script>
                </div><br>

            </div>
        </div>

        <div id="Themes" class="BotWinTab">
            <font style="margin: 15px; font-size: 16px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">Themes</font><br>

            <button class="ThemeButton" onclick="ChangeTheme(0)" style="background-image: url('../Assets/BG.png');">Lake (Default Theme)</button>
            <button class="ThemeButton" onclick="ChangeTheme(12)" style="background-image: url('../Assets/BG16.png');">Night Sky (Original Theme)</button>
            <button class="ThemeButton" onclick="ChangeTheme(1)" style="background-image: url('../Assets/BG09.png');">Clouds</button>
            <button class="ThemeButton" onclick="ChangeTheme(2)" style="background-image: url('../Assets/BG06.png');">Autumn</button>
            <button class="ThemeButton" onclick="ChangeTheme(11)" style="background-image: url('../Assets/BG15.png');">Grass</button>
            <button class="ThemeButton" onclick="ChangeTheme(3)" style="background-image: url('../Assets/BG05.png');">Celestial</button>
            <button class="ThemeButton" onclick="ChangeTheme(4)" style="background-image: url('../Assets/BG08.png');">Dreamscape</button>

        </div>

        <div id="Music" class="BotWinTab">
            <font style="margin: 15px; font-size: 16px;">Playlist</font><br>

            <div style="position: relative; left: -75px;">
                <img src="../Assets/CD.png" style="position: relative; left: 150px; height: 250px; z-index: -1; animation-name: CDSpin; animation-duration: 2s; animation-timing-function: linear; animation-iteration-count: infinite;">
                <iframe class="Playlist" src="https://www.youtube.com/embed/videoseries?si=AUfFy8t3kPVnaKqu&amp;list=PL9PlyUgDLriJE64lGE320crFgBBr--Zdg"></iframe>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("Themes").style.display = "none";
        document.getElementById("Music").style.display = "none";

        function ChangeTab(tab) {
            if (tab == 0) {
                document.getElementById("Webrings").style.display = "block";
                document.getElementById("Themes").style.display = "none";
                document.getElementById("Music").style.display = "none";
            }
            if (tab == 1) {
                document.getElementById("Webrings").style.display = "none";
                document.getElementById("Themes").style.display = "block";
                document.getElementById("Music").style.display = "none";
            }
            if (tab == 2) {
                document.getElementById("Webrings").style.display = "none";
                document.getElementById("Themes").style.display = "none";
                document.getElementById("Music").style.display = "block";
            }
        }
            function ChangeTheme(theme) {
                switch (theme) {
                    case 0: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG.png')";
                        break;
                    }
                    case 1: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG09.png')";
                        break;
                    }
                    case 2: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG06.png')";
                        break;
                    }
                    case 3: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG05.png')";
                        break;
                    }
                    case 4: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG08.png')";
                        break;
                    }
                    case 5: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/Creations/CosmicFields.png')";
                        break;
                    }
                    case 6: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG10.gif')";
                        break;
                    }
                    case 7: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG11.gif')";
                        break;
                    }
                    case 8: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG12.png')";
                        break;
                    }
                    case 9: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG13.gif')";
                        break;
                    }
                    case 10: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG14.gif')";
                        break;
                    }
                    case 11: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG15.png')";
                        break;
                    }
                    case 12: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG16.png')";
                        break;
                    }
                    case 13: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG17.gif')";
                        break;
                    }
                    case 14: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG18.png')";
                        break;
                    }
                }
            }
    </script>
    </body>
</html>
