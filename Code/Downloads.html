    <style>
        @font-face { font-family: WanderersLost; src: url('../Assets/WandererLost\ Font.ttf'); }
        a {
            text-decoration: none !important;
        }
        .Download {
            background-image: linear-gradient(rgb(93, 93, 93) 0%, rgb(50, 50, 50) 12.5%, black 35%, rgb(26, 26, 26) 90%);
            width: 280px;
            text-align: left;
            vertical-align: middle;
            font-size: 20px;
            color: white;
            background-repeat: no-repeat;
            background-position-x: right;
            margin: 15px;
            padding: 10px;
            box-shadow: 0px 0px 5px gray;
            border: 2px gray solid;
            border-radius: 4px;
            transition: 0.25s;
        }
        .Download:hover {
            transform: scale(1.2);
        }
        .DownloadsContainer {
            display: flex;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .DownloadButton {
            box-shadow: 0px 0px 5px gray;
            border: 2px gray solid;
            border-radius: 4px;
            transition: 0.25s;

            background-image: linear-gradient(rgb(118, 225, 2) 0%, rgb(29, 166, 72) 45%, rgb(6, 86, 109) 55%, rgb(1, 108, 116) 95%);
            padding: 15px 5px 0px;
            text-align: center;
            color: white;
            font-size: 14px;
            width: 65%;
            height: 30px;
            transition: 0.25s;
            image-rendering: pixelated;
        }
        .DownloadButton:hover {
            transform: scale(1.2);
            border-color: white;
        }
    </style>
