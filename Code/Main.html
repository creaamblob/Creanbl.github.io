<!DOCTYPE html>
<html id="bg" style="background-color: black;
    background: url('../Assets/BG.png') repeat center center fixed;
    -webkit-background-size: cover;
    -moz-background-size: cover;
    -o-background-size: cover;
    background-size: cover;">
    <div class="SmallScreenWarn">
        <div class="SmallScreenContain">
            Your screen is too small!<br>
            Please stretch the window or enable desktop mode in your browser!<br>
            (Usually found in a triple-dot dropdown)
        </div>
    </div>
    <head>
        <title>Crean's Website</title>
        <link rel="icon" href="../Assets/Creanbl.gif"/>
        <link rel="stylesheet" href="style.css" rel="stylesheet"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    </head><img src="../Assets/CRT.gif" class="CRT">

    <style>
        .container {
            width: 100vw;
            height: 100vh;

            overflow-x: auto;
            overflow-y: auto;

            resize: both;
            position: relative;
        }
        .ThemeWindow {
            position: fixed;
            left: 50%;
            transform: translate(-50%, -50%);
            bottom: -725px;
            line-height: 0;
            background-image: linear-gradient(rgba(32, 32, 32, 0.875), black);
            border-radius: 12.5px 12.5px 0px 0px;
            width: 90%;
            height: 500px;
            transition: 0.5s;
            box-shadow: 0px 0px 10px gray;
            border: 2px gray solid;
        }
        .ThemeWindow:hover {
            bottom: -400px;
        }
        .ThemeButton {
            padding: 5px;
            margin: 3px;
            background-size: cover;
            text-shadow: 0px 0px 2px black, 0px 0px 2px black, 0px 0px 4px black;
        }
    </style>

    <div class="container">
        <iframe src="Home.html" style="width: 100%; height: 100%; border: 0px;"></iframe>
    </div>

    <div class="ThemeWindow">
        <img src="../Assets/TennaText/NEW.png" style="vertical-align: middle; image-rendering: pixelated; border-radius: 0px;"><font style="margin: 15px; font-size: 16px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">Themes</font><img src="../Assets/TennaText/NEW.png" style="vertical-align: middle; image-rendering: pixelated; border-radius: 0px;">

        <div style="width: 70%; display: flex; flex-wrap: wrap; justify-content: center; margin: auto;">

            <button class="ThemeButton" onclick="ChangeTheme(0)" style="background-image: url('../Assets/BG.png');">Theme : Lake (Default Theme)</button>
            <button class="ThemeButton" onclick="ChangeTheme(1)" style="background-image: url('../Assets/BG09.png');">Theme : Clouds</button>
            <button class="ThemeButton" onclick="ChangeTheme(2)" style="background-image: url('../Assets/BG06.png');">Theme : Autumn</button>
            <button class="ThemeButton" onclick="ChangeTheme(3)" style="background-image: url('../Assets/BG05.png');">Theme : Celestial</button>
            <button class="ThemeButton" onclick="ChangeTheme(4)" style="background-image: url('../Assets/BG08.png');">Theme : Seraphic (Terraria Mods)</button>
            <button class="ThemeButton" onclick="ChangeTheme(5)" style="background-image: url('../Assets/Creations/CosmicFields.png');">Theme : Fields (Terraria Mods)</button>
            <button class="ThemeButton" onclick="ChangeTheme(6)" style="background-image: url('../Assets/BG10.gif');">Theme : The Third Sanctuary (Deltarune)</button>
            <button class="ThemeButton" onclick="ChangeTheme(7)" style="background-image: url('../Assets/BG11.gif');">Theme : WELCOME TO THE CITY (Deltarune)</button>
            <button class="ThemeButton" onclick="ChangeTheme(8)" style="background-image: url('../Assets/BG12.png');">Theme : Panic Betrayer (Ultrakill)</button>
            <button class="ThemeButton" onclick="ChangeTheme(9)" style="background-image: url('../Assets/BG13.gif');">Theme : City of Tears (Hollow Knight)</button>
            <button class="ThemeButton" onclick="ChangeTheme(10)" style="background-image: url('../Assets/BG14.gif');">Theme : Greenpath (Hollow Knight)</button>

        </div>
    </div>

    <script>
            function ChangeTheme(theme) {
                switch (theme) {
                    case 0: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG.png')";
                        break;
                    }
                    case 1: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG09.png')";
                        break;
                    }
                    case 2: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG06.png')";
                        break;
                    }
                    case 3: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG05.png')";
                        break;
                    }
                    case 4: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG08.png')";
                        break;
                    }
                    case 5: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/Creations/CosmicFields.png')";
                        break;
                    }
                    case 6: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG10.gif')";
                        break;
                    }
                    case 7: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG11.gif')";
                        break;
                    }
                    case 8: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG12.png')";
                        break;
                    }
                    case 9: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG13.gif')";
                        break;
                    }
                    case 10: {
                        document.getElementById("bg").style.backgroundImage = "url('../Assets/BG14.gif')";
                        break;
                    }
                }
            }
    </script>
    </body>
</html>
