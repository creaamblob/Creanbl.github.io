    <style>
        .container {
            width: 100vw;
            height: 100vh;

            overflow-x: auto;
            overflow-y: auto;

            resize: none;
            position: relative;
        }
        .ThemeWindow {
            position: fixed;
            left: 50%;
            transform: translate(-50%, -50%);
            bottom: -1175px;
            line-height: 0;
            background-image: linear-gradient(rgba(32, 32, 32, 0.75), black);
            border-radius: 12.5px 12.5px 0px 0px;
            width: 90%;
            height: 800px;
            transition: 0.5s;
            box-shadow: 0px 0px 10px gray;
            border: 2px gray solid;
            backdrop-filter: blur(12px);
        }
        .ThemeWindow:hover {
            bottom: -800px;
        }
        .WebringWindow {
            position: fixed;
            left: -370px;
            transform: translate(-50%, -50%);
            top: 50%;
            background-image: linear-gradient(rgba(32, 32, 32, 0.75), black);
            border-radius: 0px 12.5px 12.5px 0px;
            width: 800px;
            height: 90%;
            transition: 0.5s;
            box-shadow: 0px 0px 10px gray;
            border: 2px gray solid;
            backdrop-filter: blur(12px);
        }
        .WebringWindow:hover {
            left: 300px;
        }
        .ThemeButton {
            padding: 15px;
            margin: 2px;
            background-size: cover;
            text-shadow: -1px -1px black, 1px -1px black, 1px 1px black, -1px 1px 4px black;
        }
        .Playlist {
            border: none;
            height: 200px;

            box-shadow: 0px 0px 10px gray;
            border: 2px gray solid;
        }
        .WindColL {
            width: 40%;
            float: left;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: auto;
        }
        .WindColR {
            width: 60%;
            float: right;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: auto;
        }
        #aero-ring {
            background-image: linear-gradient(white, #9fe2ff75 20%, #9fe2ff75 48%, #58617275 52%, #58617275 65%, #9fe2ff75), url('../Assets/BG09.png');
            background-size: 100%;
            border-radius: 10px;
            text-shadow: -1px -1px black, 1px -1px black, 1px 1px black, -1px 1px 4px black;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.5),
            inset 0 2px 1px rgba(255, 255, 255, 0.15),
            inset 0 -2px 1px rgba(0, 0, 0, 0.35);
            font-family: sans-serif;
            margin: 10px auto 0px auto;
            max-width: 15rem;
            padding: 0.75rem;
            border: outset 2px lightseagreen;
        }
        #aero-ring:hover {
            box-shadow: 0px 0px 0px 2px white, 0px 0px 32px lightseagreen;
        }
        #aero-ring a,
        #aero-ring a:visited {
            color: rgb(255, 255, 255) !important;
            text-decoration: none;
        }
        #aero-ring a:focus,
        #aero-ring a:hover,
        #aero-ring a:active {
            transform: scale(1.2);
            color: lightseagreen !important;
            text-shadow: 0px 0px 4px white, 0px 0px 4px white;
        }
        @media screen and (max-width: 935px) {
            .WindColL {
                width: 90%;
                float: none;
            }
            .WindColR {
                display: none;
            }
        }
        @keyframes CDSpin {
            0% { rotate: 0deg;}
            100% { transform: rotate(360deg);}
        }
    </style>
