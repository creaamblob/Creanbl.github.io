<!DOCTYPE html>
<html id="background">
    <head>
        <title>Creations -★- Crean's Website</title>
        <link rel="icon" href="../../Assets/Creations.png"/>
        <link rel="stylesheet" href="../style.css" rel="stylesheet"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    </head>
    <style>
        input {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            background-image: linear-gradient(rgb(93, 93, 93) 0%, rgb(50, 50, 50) 45%, black 60%, rgb(26, 26, 26) 85%);  
            box-shadow: 0px 0px 4px gray;
            border: 2px gray solid;
            border-radius: 4px;
            color: white;
            transition: 0.25s;
        }
        input:hover {
            border-color: white;
            box-shadow: 0px 0px 4px white;
        }
        button {
            transition: 0.25s;
        }
        button:hover {
            transform: scale(1.6);
            background-color: rgb(56, 52, 66);
        }
        input[type=number]::-webkit-inner-spin-button {
            opacity: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
            transition: 0.25s;
        }
        input[type=number]:hover {
            transform: scale(1.4);
            background-color: rgb(56, 52, 66);
        }
        .RedButton {
            border-color: red;
            background-image: linear-gradient(rgb(255, 0, 0) 0%, rgb(189, 22, 50) 45%, rgb(89, 2, 40) 60%);
        }
        .ResultText {
            display: flex;
            justify-content: center;
            background-size: repeat;
            margin-top: 25px;
            padding: 25px 0px 25px;
            border-radius: 0px 0px 24px 24px;
            width: 100%;

            background-image: linear-gradient(rgb(255, 208, 221) 0%, rgb(247, 178, 199) 45%, rgb(233, 150, 182) 55%, rgb(233, 150, 182) 80%, rgb(195, 113, 162) 100%);
            box-shadow: 0px 0px 4px rgb(255, 255, 255);
            border: 2px rgb(255, 255, 255) solid;
            border-width: 0px 2px 2px;
            color: white;
            animation-name: RainbowText;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
    </style>
    <body>
        <div class="MiniNavigateBar">

            <a href="../Home.html" class="Links">
                <img src="../../Assets/Home.png" class="LinkButtonSmol">
            </a>

            <a href="../Creations.html" class="Links">
                <img src="../../Assets/Creations.png" class="LinkButtonSmol">
            </a>

            <a href="../Blogs.html" class="Links">
                <img src="../../Assets/Blog.png" class="LinkButtonSmol">
            </a>

            <a href="../Info.html" class="Links">
                <img src="../../Assets/Info.png" class="LinkButtonSmol">
            </a>

            <a href="../Misc.html" class="Links">
                <img src="../../Assets/Misc.png" class="LinkButtonSmol">
            </a>            <a href="../Main.html" target="_parent" class="Links" style="position: absolute; top: 5px; font-size: 10px; height: 20px; color: aqua;">
                Return to Main.html
            </a>
        </div>

        <br>

        <div class="Window" style="width: 60vw; height: fit-content; border-radius: 12.5px 12.5px 50px 50px;">
            <div class="Top">
                Calculator
            </div>
    
            <div class="StarBlanket">
                <div class="Glass">
                    <button onclick="ChangeNumber(1)">sin</button>
                    <button onclick="ChangeNumber(2)">cos</button>
                    <button onclick="ChangeNumber(3)">tan</button>
                    <button onclick="ChangeNumber(100)">sqrt</button>
                    <button onclick="ChangeNumber(102)">PI</button>
                    <button onclick="ChangeNumber(104)" class="RedButton">CE</button><br>
                    <input id="number1" placeholder="Number 1" type="number"><br>
                    <input id="number2" placeholder="Number 2" type="number"><br>
                    <button onclick="ChangeNumber(4)">sin</button>
                    <button onclick="ChangeNumber(5)">cos</button>
                    <button onclick="ChangeNumber(6)">tan</button>
                    <button onclick="ChangeNumber(101)">sqrt</button>
                    <button onclick="ChangeNumber(103)">PI</button>
                    <button onclick="ChangeNumber(105)" class="RedButton">CE</button><br>
                    <button onclick="ChangeNumber(150)" class="RedButton">AC</button><br><br>
                    <button onclick="CalculateAnswer(0)">+</button> <button  onclick="CalculateAnswer(1)">-</button> <button  onclick="CalculateAnswer(10)">+%</button><br>
                    <button onclick="CalculateAnswer(2)">*</button> <button  onclick="CalculateAnswer(3)">/</button><br><br>
                </div>
            </div>
            <div id="Result" class="ResultText">
                Result
            </div>
        </div><br><br>
        
        <script>
            var num1 = document.getElementById("number1").value;
            var num2 = document.getElementById("number2").value;
            var divideZeroCounter = 0;

            function ChangeNumber(mode) {
                    var num1 = document.getElementById("number1").value;
                    var num2 = document.getElementById("number2").value;

                    switch (mode) {
                        //Num 1
                        case 1: document.getElementById("number1").value = Math.sin(num1); break;
                        case 2: document.getElementById("number1").value = Math.cos(num1); break;
                        case 3: document.getElementById("number1").value = Math.tan(num1); break;
                        case 100: document.getElementById("number1").value = Math.sqrt(num1); break;
                        case 102: document.getElementById("number1").value = Math.PI; break;
                        case 104: document.getElementById("number1").value = ""; break;
                        //Num 2
                        case 4: document.getElementById("number2").value = Math.sin(num2); break;
                        case 5: document.getElementById("number2").value = Math.cos(num2); break;
                        case 6: document.getElementById("number2").value = Math.tan(num2); break;
                        case 101: document.getElementById("number2").value = Math.sqrt(num2); break;
                        case 103: document.getElementById("number2").value = Math.PI; break;
                        case 105: document.getElementById("number2").value = ""; break;

                        case 150: {
                            document.getElementById("number1").value = "";
                            document.getElementById("number2").value = "";
                            break;
                        }
                    }
            }
            function CalculateAnswer(mathType) {
                var num1 = document.getElementById("number1").value;
                var num2 = document.getElementById("number2").value;

                var realNum1 = num1;
                var realNum2 = num2;
                var amount;
                var val = ":(";

                if (mathType == 0) {
                    val = Number(num1) + Number(num2);
                }
                if (mathType == 1) {
                    val = Number(num1) - Number(num2);
                }
                if (mathType == 2) {
                    val = Number(num1) * Number(num2);
                }
                if (mathType == 3) {
                    val = Number(num1) / Number(num2);
                    if ((num1 == 0 || num2 == 0) && num1 != "" && num2 != "") {
                        document.getElementById("background").style.backgroundImage = "none";
                        document.getElementById("background").style.backgroundColor = "black";

                        document.getElementById("Result").style.backgroundImage = "none";
                        document.getElementById("Result").style.backgroundColor = "black";

                        document.getElementById("Result").style.fontSize = "20px";

                        divideZeroCounter += 1;

                        if (document.getElementById("Result").innerHTML != " ... ") {
                            val = "..."
                        }
                        else {
                            val = " ... ";
                        }

                        switch (document.getElementById("Result").innerHTML) {
                            case "...": val = "... What are you doing?"; break;
                            case "... What are you doing?": val = "... You know that you can't divide by zero..."; break;
                            case "... You know that you can't divide by zero...": val = "... Are you expecting some secret dialog?"; break;
                            case "... Are you expecting some secret dialog?": val = "... Well, there may or may not be some..."; break;
                            case "... Well, there may or may not be some...": val = "Alright I'm not really evil, there's actually none. Please trust me."; break;
                            case "Alright I'm not really evil, there's actually none. Please trust me.": val = " ... "; break;
                        }
                    }
                }
                if (mathType == 4) {
                    val = Number(num1) * Math.sin(Number(num2));
                }
                if (mathType == 5) {
                    val = Number(num1) * Math.cos(Number(num2));
                }
                if (mathType == 6) {
                    val = Number(num1) * Math.tan(Number(num2));
                }

                if (mathType == 7) {
                    val = Number(num1) / Math.sin(Number(num2));
                }
                if (mathType == 8) {
                    val = Number(num1) / Math.cos(Number(num2));
                }
                if (mathType == 9) {
                    val = Number(num1) / Math.tan(Number(num2));
                }
                if (mathType == 10) {
                    val = (Number(num1) * (100 + Number(num2))) / 100;
                }

                if (num1 == "" && num2 == "") {
                    val = "Please enter something!"
                }

                document.getElementById("Result").style.color = "white";
                document.getElementById("Result").innerHTML = String(val);
            }
        </script>
    </body>
</html>
